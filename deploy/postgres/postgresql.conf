# PostgreSQL settings for Calor on a small VPS (4 GB RAM shared with the API
# and the dashboard). docker-compose caps the server at 1 GiB; these keep its
# own memory near 300-450 MiB at peak and leave the rest to the page cache.
# Everything not listed keeps the PostgreSQL 16 default.
#
# docker-compose mounts this file as config_file and adds
# listen_addresses='*'; on a host install, include it from postgresql.conf
# (include_dir 'conf.d' on Debian/Ubuntu) and keep listen_addresses local.

# Connections: the API opens at most CALOR_DB_READ_CONNS + CALOR_DB_WRITE_CONNS
# (4 + 2). The rest is headroom for psql, backups and the SQLite importer.
max_connections = 20
superuser_reserved_connections = 3
idle_in_transaction_session_timeout = 60s

# Memory
shared_buffers = 256MB
work_mem = 8MB                     # per sort/hash node; month-range GROUP BYs fit
maintenance_work_mem = 64MB
autovacuum_work_mem = 32MB
effective_cache_size = 1GB         # planner hint: what the OS is likely caching for us
temp_file_limit = 1GB

# Analytics queries are short; JIT compilation costs more than it saves here.
jit = off
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# WAL and checkpoints. The API turns synchronous_commit off for event batches
# only (like SQLite's synchronous=NORMAL); everything else commits durably.
wal_compression = lz4
wal_buffers = 16MB
min_wal_size = 128MB
max_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# SSD-backed VPS
random_page_cost = 1.1
effective_io_concurrency = 200

# Autovacuum: events are append-mostly, so vacuum on inserts too (keeps the
# visibility map current for index-only scans); two workers are plenty.
autovacuum_max_workers = 2
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.05

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_autovacuum_min_duration = 10s
log_temp_files = 16MB
log_timezone = 'UTC'
timezone = 'UTC'
